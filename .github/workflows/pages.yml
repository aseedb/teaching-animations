# Tests and builds every animation, then publishes the standalone pages with GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build every animation
        run: |
          mkdir -p _site
          for p in aktin-lamellipodium mikrotubuli-instabilitaet sarkomer-kraft-laenge desmosomen-zugkraft; do
            (cd "$p" && npm test && node build.mjs)
            mkdir -p "_site/$p"
            cp "$p/dist/ilias/index.html" "_site/$p/index.html"
          done
          cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
